<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 78 900 122" fill="none" aria-hidden="true">
  <!-- Standalone version of the car line from the logo mark, drawn wider and
       with a longer profile so it reads as a watermark rather than a shrunken
       logo. Stroke only — it sits over a dark background at low opacity. -->
  <defs>
    <linearGradient id="carGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A67C1A" stop-opacity="0"/>
      <stop offset="18%" stop-color="#D4AF37" stop-opacity="1"/>
      <stop offset="50%" stop-color="#F5D98B" stop-opacity="1"/>
      <stop offset="82%" stop-color="#D4AF37" stop-opacity="1"/>
      <stop offset="100%" stop-color="#A67C1A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g stroke="url(#carGold)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- main body sweep -->
    <path d="M20 186 C 150 186, 214 96, 450 96 C 686 96, 760 168, 880 186" stroke-width="4"/>
    <!-- roof / greenhouse -->
    <path d="M212 160 C 268 112, 352 102, 452 102 C 560 102, 634 122, 700 164" stroke-width="2.6"/>
    <!-- windscreen pillar -->
    <path d="M470 104 L 592 154" stroke-width="2"/>
    <!-- door crease -->
    <path d="M300 170 C 400 156, 520 156, 640 172" stroke-width="1.5" opacity="0.75"/>
    <!-- wheel arches -->
    <path d="M196 186 A 46 46 0 0 1 288 186" stroke-width="2.6"/>
    <path d="M628 186 A 46 46 0 0 1 720 186" stroke-width="2.6"/>
    <!-- ground line -->
    <path d="M0 187 L 900 187" stroke-width="1" opacity="0.45"/>
  </g>
</svg>
