<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 108" role="img" aria-label="Gem Car Rentals">
  <title>Gem Car Rentals</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5D98B"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A67C1A"/>
    </linearGradient>
    <linearGradient id="facetLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2C4F8C"/>
      <stop offset="100%" stop-color="#1E3A6E"/>
    </linearGradient>
    <linearGradient id="facetDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E3A6E"/>
      <stop offset="100%" stop-color="#122747"/>
    </linearGradient>
  </defs>

  <!-- ============ DIAMOND ============ -->
  <g>
    <!-- crown facets -->
    <polygon points="20,34 40,34 30,14"   fill="url(#facetLight)"/>
    <polygon points="40,34 60,34 50,14"   fill="url(#facetDark)"/>
    <polygon points="60,34 80,34 70,14"   fill="url(#facetLight)"/>
    <polygon points="80,34 100,34 90,14"  fill="url(#facetDark)"/>
    <!-- table -->
    <polygon points="30,14 90,14 80,34 40,34" fill="url(#facetLight)" opacity="0.55"/>
    <!-- pavilion -->
    <polygon points="20,34 60,34 60,74"   fill="url(#facetDark)"/>
    <polygon points="60,34 100,34 60,74"  fill="url(#facetLight)"/>
    <polygon points="40,34 60,34 60,74"   fill="url(#facetLight)" opacity="0.35"/>
    <polygon points="60,34 80,34 60,74"   fill="url(#facetDark)"  opacity="0.5"/>

    <!-- gold framing -->
    <g fill="none" stroke="url(#gold)" stroke-width="3.2" stroke-linejoin="round">
      <polygon points="20,34 100,34 60,74"/>
      <polygon points="30,14 90,14 100,34 20,34"/>
      <path d="M30 14 L40 34 M50 14 L60 34 M70 14 L80 34"/>
      <path d="M40 34 L60 74 M80 34 L60 74"/>
    </g>
  </g>

  <!-- ============ CAR SILHOUETTE ============ -->
  <g fill="none" stroke="url(#gold)" stroke-linecap="round">
    <path d="M6 100 C 26 100, 34 78, 60 78 C 86 78, 96 96, 114 100"
          stroke-width="3.4"/>
    <path d="M30 96 C 40 84, 52 82, 62 82 C 74 82, 82 86, 90 94"
          stroke-width="2.2" opacity="0.95"/>
    <path d="M64 83 L 78 92" stroke-width="1.8" opacity="0.8"/>
  </g>
</svg>
